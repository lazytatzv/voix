services:
  # VOICEVOX Engine (CPU版) - 一般的な環境用
  voicevox-cpu:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    container_name: voicevox_engine
    ports:
      - "50021:50021"
    restart: unless-stopped

  # NVIDIA GPU版 (GPUアクセラレーションを使用したい場合)
  # 起動方法: docker compose --profile gpu up -d
  voicevox-gpu:
    image: voicevox/voicevox_engine:nvidia-ubuntu20.04-latest
    container_name: voicevox_engine_gpu
    ports:
      - "50021:50021"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["gpu"]
